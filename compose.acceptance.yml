services:
  acceptance-migrate:
    image: environmental-platform-api:local
    command: ["python", "-m", "scripts.prepare_acceptance"]
    environment:
      ESP_DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD}@postgres:5432/platform?options=-csearch_path%3Dacceptance
      ESP_REDIS_URL: redis://redis:6379/1
      ESP_SECRET_KEY: ${ESP_SECRET_KEY}
      ESP_ENVIRONMENT: test
      ESP_STORAGE_ROOT: /workspace/var/platform/acceptance
    volumes: ["platform-files:/workspace/var/platform", "./app:/workspace/app:ro", "./scripts:/workspace/scripts:ro"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  acceptance-api:
    image: environmental-platform-api:local
    environment:
      ESP_DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD}@postgres:5432/platform?options=-csearch_path%3Dacceptance
      ESP_REDIS_URL: redis://redis:6379/1
      ESP_SECRET_KEY: ${ESP_SECRET_KEY}
      ESP_ENVIRONMENT: test
      ESP_STORAGE_ROOT: /workspace/var/platform/acceptance
      ESP_PUBLIC_ORIGIN: "${ACCEPTANCE_PUBLIC_ORIGIN:-http://localhost:8081}"
    volumes: ["platform-files:/workspace/var/platform", "./app:/workspace/app:ro", "./scripts:/workspace/scripts:ro"]
    ports: ["127.0.0.1:58001:8000"]
    depends_on:
      acceptance-migrate:
        condition: service_completed_successfully
  acceptance-worker:
    image: environmental-platform-api:local
    command: ["celery", "-A", "app.v2.tasks:celery_app", "worker", "-Q", "io,models", "--concurrency=1", "--loglevel=INFO"]
    environment:
      ESP_DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD}@postgres:5432/platform?options=-csearch_path%3Dacceptance
      ESP_REDIS_URL: redis://redis:6379/1
      ESP_SECRET_KEY: ${ESP_SECRET_KEY}
      ESP_ENVIRONMENT: test
      ESP_STORAGE_ROOT: /workspace/var/platform/acceptance
    volumes: ["platform-files:/workspace/var/platform", "./app:/workspace/app:ro"]
    depends_on:
      acceptance-migrate:
        condition: service_completed_successfully
  acceptance-scheduler:
    image: environmental-platform-api:local
    command: ["python", "-m", "app.v2.scheduler"]
    environment:
      ESP_DATABASE_URL: postgresql+psycopg://platform:${POSTGRES_PASSWORD}@postgres:5432/platform?options=-csearch_path%3Dacceptance
      ESP_REDIS_URL: redis://redis:6379/1
      ESP_SECRET_KEY: ${ESP_SECRET_KEY}
      ESP_ENVIRONMENT: test
      ESP_STORAGE_ROOT: /workspace/var/platform/acceptance
    volumes: ["platform-files:/workspace/var/platform", "./app:/workspace/app:ro"]
    depends_on:
      acceptance-migrate:
        condition: service_completed_successfully
  acceptance-web:
    image: environmental-platform-web:local
    ports: ["127.0.0.1:8081:80"]
    volumes: ["./deployment/nginx.acceptance.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [acceptance-api]
