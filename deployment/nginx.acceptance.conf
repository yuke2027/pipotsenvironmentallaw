server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 51m;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;
    # Keep the API's public-origin/CSRF check stable when browser tests run
    # from either the host or another container on the acceptance network.
    location /api/ {
        set $api_backend acceptance-api:8000;
        proxy_pass http://$api_backend;
        proxy_set_header Host localhost:8081;
    }
    location / { try_files $uri $uri/ /index.html; }
}
