services:
  platform:
    build: .
    image: environmental-supervision-platform:local
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      DATABASE_URL: sqlite:////data/environmental_supervision.db
      COLLECTION_INTERVAL_SECONDS: ${COLLECTION_INTERVAL_SECONDS:-3600}
      ALERT_EMAIL_CREDENTIAL_REF: ${ALERT_EMAIL_CREDENTIAL_REF:-}
      ALERT_WEBHOOK_CREDENTIAL_REF: ${ALERT_WEBHOOK_CREDENTIAL_REF:-}
    ports:
      - "8000:8000"
    volumes:
      - platform-db:/data
      - platform-models:/app/var/models
      - platform-exports:/app/var/exports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  platform-db:
  platform-models:
  platform-exports:
